plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.lifeos'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.lifeos"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0-Grid"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
